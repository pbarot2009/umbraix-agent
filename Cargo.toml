[package]
name = "umbraix-agent"
version = "0.2.0"
description = "Umbraix Agent - multi-tenant Gemini-powered Discord server administration agent"
license = "MIT"
edition = "2021"

[dependencies]
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-cache-inmemory = { version = "0.17", features = ["permission-calculator"] }
twilight-util = { version = "0.17", features = ["builder"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
futures = "0.3"
dashmap = "6"

# Explicitly disable default-features to avoid pulling in aws-lc-rs
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
