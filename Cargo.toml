[package]
name = "discord-gemini-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Explicitly disable default-features to avoid pulling in aws-lc-rs
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
